name: Khosro Signal Engine

# Triggers:
# - schedule:      every 30 minutes (backup in case Wispbyte auto-trigger fails)
# - workflow_dispatch: triggered by Wispbyte server (main auto-trigger path)
# - push to engine/: regenerate immediately after engine code changes
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Trigger reason (for log traceability)"
        required: false
        default: "auto"
  push:
    branches:
      - main
    paths:
      - "engine/**"
      - ".github/workflows/signal-engine.yml"

permissions:
  contents: write   # needed for git push in the auto-commit step

# Serialize parallel runs — only one runner updates signals.json at a time.
# The retry loop below handles the rare race when the dashboard server
# triggers a workflow_dispatch in parallel with a scheduled run.
concurrency:
  group: signal-engine
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout with FULL history (fetch-depth: 0) ─────────────────────
      - name: Checkout repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true   # leave credentials so we can push later

      # ── 2. Set git identity for the auto-commit ─────────────────────────────
      - name: Configure git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ── 3. Python runtime ──────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      # ── 4. Run the signal engine ───────────────────────────────────────────
      - name: Run signal engine
        env:
          BINANCE_BASE: "https://data-api.binance.vision"
          KHOSRO_VERBOSE: "1"
        run: |
          python engine/main.py

      # ── 5. Show the diff so we can debug when nothing changes ────────────────
      - name: Show signals.json diff
        if: always()
        run: |
          if git diff --quiet signals.json; then
            echo "✅ signals.json unchanged"
          else
            echo "📝 signals.json changed:"
            git --no-pager diff --stat signals.json
          fi

      # ── 6. Commit + push (bulletproof for auto-generated JSON) ─────────────
      # signals.json is fully auto-generated by the engine. No semantic merge
      # is ever needed — last-writer-wins is the correct semantic. We avoid
      # `git rebase` entirely (which produces CONFLICT markers on full-file
      # rewrites) and instead use a fetch→reset→reapply→push retry loop.
      - name: Commit & push (conflict-safe)
        run: |
          if git diff --quiet signals.json; then
            echo "No changes to commit. Skipping push."
            exit 0
          fi

          # Save our freshly-generated signals.json content to a temp file
          # (so we can re-apply it after any number of remote resets/retries).
          cp signals.json /tmp/new_signals.json
          echo "💾 Saved new signals.json ($(wc -c < /tmp/new_signals.json) bytes)"

          # Stage and commit locally (for the local reflog; we'll re-commit after reset)
          git add signals.json
          git commit -m "Auto-update signals.json [skip ci]"

          # Retry loop: fetch latest → reset hard → reapply our file → push.
          for attempt in 1 2 3 4 5; do
            echo "── Attempt $attempt ──"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/new_signals.json signals.json
            git add signals.json
            # If our content matches remote (race resolved itself), exit cleanly.
            if git diff --cached --quiet; then
              echo "✅ Remote already has equivalent signals.json (resolved on attempt $attempt)."
              exit 0
            fi
            git commit -m "Auto-update signals.json [skip ci]"
            # force-with-lease: only push if remote main is still at the tip we
            # just fetched (rejects if someone pushed between fetch & push).
            if git push --force-with-lease origin HEAD:main; then
              echo "✅ Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "⚠️ Push attempt $attempt rejected (concurrent push). Retrying in 5s..."
            sleep 5
          done

          echo "❌ Push failed after 5 attempts."
          exit 1
