name: Generate Crypto Signals
on:
  schedule:
    - cron: "0,30 1-20 * * *"   # هر ۳۰ دقیقه بین ۱ تا ۲۰ UTC (ساعات فعال تهران)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: khosro-engine
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run engine — generate signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python engine/main.py

      - name: Commit and push signals.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add signals.json
          git commit -m "Auto-update signals.json [skip ci]" || exit 0
          git push
